name: 🐛 Bug Report
description: Report something broken or unexpected in Pyrewarden
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as you can — the more detail, the faster the fix.

  - type: input
    id: version
    attributes:
      label: Game version
      description: Visible in the bottom-right of the main menu (e.g. `v0.1.3`).
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options:
        - Singleplayer
        - Multiplayer (host)
        - Multiplayer (client)
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you saw, including any error messages.
      placeholder: "Tower X stopped attacking after wave 12 and the game crashed when I clicked Sell."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: "The tower should keep firing or sell normally."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps a tester could follow to see the bug.
      placeholder: |
        1. Start a new game on Coral Causeway, seed 42.
        2. Build a Frost tower at row 4, column 7, upgrade path B.
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        Drag in any screenshots. Game log file is at:
        - macOS: `~/Library/Application Support/Pyrewarden/logs/`
        - Windows: `%APPDATA%\Pyrewarden\logs\`
        - Linux: `~/.local/share/Pyrewarden/logs/`

  - type: textarea
    id: additional
    attributes:
      label: Anything else
      description: Hardware, mods, save file age, anything else that might matter.
