name: ✨ Feature Request
description: Suggest anything you'd like to see in the game
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Title goes at the top of the issue; describe what you'd like below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see? Feel free to include the *why* if it helps explain.
    validations:
      required: true
