name: ✨ Feature Request
description: Suggest a new mechanic, tower, synergy, map, or QoL change
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the *what* and the *why* — what should the game do, and why does it matter.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New tower / school
        - New synergy
        - New map
        - New enemy
        - Balance change
        - UI / UX
        - Multiplayer
        - Accessibility
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What would you like to see?
      placeholder: "A Time + Beasts synergy that slows the enemy during a tower's first attack."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
      description: What problem does this solve, or what experience does it enable?
      placeholder: "Time + Beasts currently lacks a defining combo and feels weaker than other school pairings."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered (optional)
